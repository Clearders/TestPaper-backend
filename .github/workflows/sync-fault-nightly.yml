name: Sync Fault Model Nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  randomized-sync-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.11.32
          uv sync --locked --dev

      - name: Run 10,000 deterministic fault sequences
        env:
          SYNC_FAULT_SEQUENCES: "10000"
        run: uv run --locked pytest tests/test_sync_fault_model.py -q
