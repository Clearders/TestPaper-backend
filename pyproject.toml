[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testpaper-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17.0",
    "argon2-cffi>=23.1.0",
    "celery[redis]>=5.5.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.4",
    "uvicorn>=0.46.0",
    "websockets>=15.0.1,<16",
    "python-dotenv>=1.2.2",
]

[project.scripts]
testpaper-backend = "testpaper_backend.main:main"
testpaper-config = "testpaper_backend.config_cli:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["testpaper_backend*"]
exclude = ["alembic*", "tests*", "scripts*"]

[tool.setuptools.package-data]
testpaper_backend = ["documents/*.docx"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0,<3",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "setuptools>=68",
]

[tool.ruff]
line-length = 140
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
