name: testpapers-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testpapers}
      POSTGRES_USER: ${POSTGRES_USER:-testpapers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpapers-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: ["async"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
    profiles: ["async"]
    command: ["/bin/sh", "-c", "python scripts/validate_config.py && celery -A testpaper_backend.worker.celery_app:celery worker --loglevel=info"]
    environment:
      TESTPAPERS_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-testpapers}:${POSTGRES_PASSWORD:-testpapers-local-only}@postgres:5432/${POSTGRES_DB:-testpapers}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATA_DIR: /var/lib/testpapers
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_HOSTS: localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - runtime-data:/var/lib/testpapers
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: ["object-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-testpapers-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-testpapers-local-only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  runtime-data:
